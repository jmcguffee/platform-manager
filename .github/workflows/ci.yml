name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Ubuntu runners start right away. Homebrew (preinstalled on GitHub's Ubuntu image) installs the
    # same jq, yq, shellcheck and bats versions a Mac gets, so this tests what pmgr actually runs with.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools with Homebrew
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install jq yq shellcheck bats-core
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - run: jq --version && yq --version && bats --version && shellcheck --version | sed -n 2p
      - run: shellcheck bin/pmgr lib/pmgr/*.sh tests/stubs/fake tests/helpers.bash
      - run: bats tests/
      - run: bin/pmgr version
