name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macOS, because that's where pmgr runs: this also proves it works on the system bash 3.2.
    runs-on: macos-latest
    # The tests take about two minutes; the rest is headroom for slow macOS runner queues, which
    # count against this limit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: brew install jq yq shellcheck bats-core
      - run: /bin/bash --version | head -1
      - run: shellcheck bin/pmgr lib/pmgr/*.sh tests/stubs/fake tests/helpers.bash
      - run: bats tests/
      - run: bin/pmgr version
