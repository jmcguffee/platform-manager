[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-manager"
version = "0.1.0"
description = "Health checks for an AWS + EKS + Argo CD platform: cluster access, SSO/PIM sessions, pipelines, and config gaps."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# Keep this list short. Every runtime dependency is CVE surface.
dependencies = ["PyYAML>=6.0.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "pip-audit>=2.7"]

[project.scripts]
pmgr = "platform_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
platform_manager = ["config.example.toml"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S603", "S607"] # subprocess calls are list-form with no shell; see runner.py

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
