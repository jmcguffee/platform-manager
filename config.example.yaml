# platform-manager config. Lives at ~/.config/platform-manager/config.yaml
# (or wherever PMGR_CONFIG points). It holds org-specific details, so keep it
# out of git.

pim:
  # Where to activate your AWS roles (PIM for Groups' "My roles" page).
  # Set to "" if you don't use PIM: hints then point at SSO login instead.
  activation_url: "https://portal.azure.com/#view/Microsoft_Azure_PIMCommon/ActivationMenuBlade/~/aadgroup"
  session_hours: 8   # how long an activation lasts
  warn_minutes: 30   # warn when a session with a visible expiry has less than this left

aws:
  # How `pmgr login` refreshes a session. {profile} becomes the profile name.
  # A list, run directly: it never goes through a shell.
  refresh_command: [aws, sso, login, --profile, "{profile}"]
  # SSO accounts with no cluster, checked by `pmgr status`.
  profiles: []

# One entry per cluster. `pmgr init --from-kubeconfig` fills these in for you.
clusters:
  - name: staging
    context: arn:aws:eks:us-east-1:111111111111:cluster/staging
    aws_profile: staging-platform
    expected_role: PlatformAdmin          # part of the assumed-role ARN
    pim_group: AWS-Staging-PlatformAdmin  # shown in hints so you know what to activate
  - name: prod
    context: arn:aws:eks:us-east-1:222222222222:cluster/prod
    aws_profile: prod-platform
    expected_role: PlatformAdmin
    pim_group: AWS-Prod-PlatformAdmin

workloads:
  event_window_minutes: 60   # how far back to read Warning events (Kubernetes keeps about an hour)
  ignore_namespaces: []      # namespaces to skip, e.g. [sandbox]

utilization:
  lookback_days: 14     # CloudWatch history to judge by
  cpu_low: 10           # average CPU % under which a resource counts as oversized...
  cpu_low_peak: 30      # ...if its peaks also stay under this
  cpu_high: 80          # p95 CPU % that counts as running hot
  msk_cpu_high: 60      # MSK brokers: AWS recommends staying under 60%
  storage_free_low: 15  # RDS free storage %
  disk_high: 80         # Redshift disk used %
  memory_high: 80       # ElastiCache memory used %
  regions: {}           # region per profile when ~/.aws/config doesn't set one, e.g. {prod-platform: us-east-2}

security:
  # Which tag says what environment a resource is in. Resources without it fall back to their VPC's
  # tag, then to account_environments.
  environment_tag: Environment          # e.g. values dev, rc, uat, prd
  public_environments: [prd]            # the only place internet-facing load balancers belong
  web_ports: [80, 443]                  # ports the public load balancer may open to 0.0.0.0/0
  account_environments: {}              # per profile, when resources aren't tagged, e.g. {prod-platform: prd}
  allowed_public: []                    # deliberate exceptions: security group IDs, LB names, resource IDs

cost:
  # GitHub Actions rate for private repos, used to estimate CI cost (Linux 2-core list price).
  actions_usd_per_minute: 0.008

# Datadog on-call, read through Pup (brew install datadog-labs/pack/pup; then pup auth login).
# Remove this section to skip it.
datadog:
  site: datadoghq.com   # the host you log in to, e.g. yourorg.datadoghq.com or datadoghq.eu
  teams: []             # on-call team handles to watch, e.g. [platform, sre]; empty = all pages
  # org: ""             # a named Pup org session, if you use several
  schedules: []         # on-call schedules for "who's on call": names (wildcards ok, e.g. "OnePass*") or IDs; empty = all
  people_teams: []      # show everyone on these Datadog teams (handle or name), e.g. [devops]
  people: []            # plus these people, by Datadog login email; both empty = everyone
  oncall_days: 7        # how far ahead to show

github:
  org: your-org
  lookback_days: 14
  max_runs_per_repo: 300
  # kind: terraform | gitops | app | other. It decides which repo-level gap checks run.
  # Use owner/repo for a repo outside `org`.
  repos:
    - {name: platform-infra, kind: terraform}
    - {name: platform-apps, kind: gitops}
    - {name: dns, kind: terraform}
